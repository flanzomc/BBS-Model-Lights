plugins { id 'fabric-loom' version '1.15.5' }
version = '0.1.0-alpha.1'
group = 'dev.flanzo'
base { archivesName = 'bbs-model-lights' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.4'
    mappings 'net.fabricmc:yarn:1.20.4+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.97.3+1.20.4'
    modImplementation files('libs/bbs-2.5.2-1.20.4.jar')
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') }
